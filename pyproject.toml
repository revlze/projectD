[project]
name = "project-d"
version = "0.1.0"
description = "Coordination of LLM agents over a shared resource: simulation, evaluation and formal verification"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Agent prompts and tool descriptions are in Russian, so Cyrillic is intentional there.
"src/project_d/agents/*.py" = ["RUF001"]
"tests/test_agents.py" = ["RUF001"]
